<!DOCTYPE html>
<html lang="en" class="theme-warm dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StandBuddy Settings</title>

  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="panel.css">
  <style>
    /* A setting: label on the left, its control on the right. */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 36px;
    }
    h2 + .row, h2 + .field { margin-top: 12px; }
    .row + .row, .field + .field { margin-top: 14px; }
    .row > label, .row-label { color: var(--text-secondary); }
    label.row { cursor: pointer; }
    label.row .hint { display: block; margin-top: 1px; }
    label.row .row-label { color: var(--text-primary); }

    /* Dark / Light and the value presets share one pill language. */
    .seg, .presets { display: flex; gap: 6px; flex-wrap: wrap; }
    .presets { margin-top: 10px; }
    .seg button, .preset-btn {
      height: 32px;
      min-width: 46px;
      padding: 0 13px;
      border: 1px solid color-mix(in srgb, var(--text-primary) 20%, transparent);
      border-radius: 100px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .seg button:hover, .preset-btn:hover { border-color: var(--text-secondary); color: var(--text-primary); }
    .seg button[aria-pressed="true"], .preset-btn.active {
      background: var(--accent);
      border-color: transparent;
      color: var(--text-on-accent);
      font-weight: 600;
    }

    .theme-picker { display: flex; gap: 10px; }
    .theme-btn {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .theme-btn:hover { box-shadow: 0 0 0 2px var(--bg-base), 0 0 0 3px var(--text-muted); }
    .theme-btn[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg-base), 0 0 0 4px var(--text-primary); }
    .theme-btn[data-theme="warm"] { background: #c9a86c; }
    .theme-btn[data-theme="ocean"] { background: #5b9bd5; }
    .theme-btn[data-theme="forest"] { background: #6b9b6b; }
    .theme-btn[data-theme="lavender"] { background: #9b7bb8; }
    .theme-btn[data-theme="slate"] { background: #6b7b8b; }
    .theme-btn[data-theme="rose"] { background: #c98b9b; }

    /* A value reads as a sentence: "Remind me every [35] minutes" — the field sits in the text. */
    .say { display: flex; align-items: center; gap: 10px; min-height: 36px; }
    .say span { color: var(--text-secondary); }
    .say + .say, .field + .say, .say + .field { margin-top: 14px; }
    input[type="number"], input[type="time"] {
      height: 36px;
      border: 1px solid color-mix(in srgb, var(--text-primary) 18%, transparent);
      border-radius: 10px;
      background: var(--bg-input);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      caret-color: var(--accent-ink);
      transition: border-color 0.15s;
    }
    input[type="number"] { width: 58px; text-align: center; }
    input[type="time"] { padding: 0 10px; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"]:focus, input[type="time"]:focus { outline: none; border-color: var(--accent-ink); }
    input[type="number"].error { border-color: var(--danger); }

    .switch {
      appearance: none;
      flex: none;
      width: 40px;
      height: 24px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--text-primary) 22%, transparent);
      position: relative;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .switch::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--bg-base);
      transition: transform 0.2s var(--ease-out);
    }
    .switch:checked { background: var(--accent); }
    .switch:checked::before { transform: translateX(16px); }

    /* Options that only matter while the switch above them is on. */
    .sub { display: none; margin-top: 14px; }
    .sub.visible { display: block; }
    .sub-title { margin-top: 18px; color: var(--text-secondary); }

    .game-list { list-style: none; margin-top: 4px; }
    .game-list:empty { display: none; }
    .game-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
      border-bottom: var(--hairline);
    }
    .game-item .icon-btn { margin-right: -8px; }
    .game-item .icon-btn:hover { color: var(--danger); }
    .game-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .game-pause {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      cursor: pointer;
    }
    input[type="checkbox"]:not(.switch) { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
    .game-empty { margin-top: 6px; }
    .game-add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    .steam-scan-panel {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border: var(--hairline);
      border-radius: 12px;
    }
    .steam-scan-panel.visible { display: block; }
    .steam-scan-status:empty { display: none; }
    .steam-scan-list {
      list-style: none;
      margin: 8px -4px 0;
      max-height: 220px;
      overflow-y: auto;
    }
    .steam-scan-list:empty { display: none; }
    .steam-scan-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .steam-scan-item:hover { background: var(--accent-soft); }
    .steam-scan-item.added { opacity: 0.55; cursor: default; }
    .steam-scan-item.added:hover { background: transparent; }
    .steam-scan-name { flex: 1; min-width: 0; }
    .steam-scan-exe { font-size: 12px; color: var(--text-secondary); }
    .steam-scan-actions { display: none; gap: 8px; margin-top: 10px; }
    .steam-scan-actions.visible { display: flex; }

    .foot { justify-content: flex-end; }
    .foot .btn { min-width: 104px; }
  </style>
</head>
<body>
  <header class="bar" data-drag>
    <h1>Settings</h1>
    <button type="button" class="icon-btn" id="closeBtn" aria-label="Close without saving"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
  </header>

  <main class="scroll">
    <section>
      <h2>Appearance</h2>
      <div class="row">
        <span class="row-label">Mode</span>
        <div class="seg" id="modePicker" role="group" aria-label="Mode">
          <button type="button" data-mode="dark">Dark</button>
          <button type="button" data-mode="light">Light</button>
        </div>
      </div>
      <div class="row">
        <span class="row-label">Color</span>
        <div class="theme-picker" id="themePicker" role="group" aria-label="Color">
          <button type="button" class="theme-btn" data-theme="warm" title="Warm" aria-label="Warm"></button>
          <button type="button" class="theme-btn" data-theme="ocean" title="Ocean" aria-label="Ocean"></button>
          <button type="button" class="theme-btn" data-theme="forest" title="Forest" aria-label="Forest"></button>
          <button type="button" class="theme-btn" data-theme="lavender" title="Lavender" aria-label="Lavender"></button>
          <button type="button" class="theme-btn" data-theme="slate" title="Slate" aria-label="Slate"></button>
          <button type="button" class="theme-btn" data-theme="rose" title="Rose" aria-label="Rose"></button>
        </div>
      </div>
    </section>

    <section>
      <h2>Breaks</h2>
      <div class="field">
        <div class="say">
          <label for="interval">Remind me every</label>
          <input type="number" id="interval" min="1" value="30">
          <span>minutes</span>
        </div>
        <div class="presets" id="intervalPresets">
          <button type="button" class="preset-btn" data-value="30">30</button>
          <button type="button" class="preset-btn" data-value="35">35</button>
          <button type="button" class="preset-btn" data-value="40">40</button>
          <button type="button" class="preset-btn" data-value="45">45</button>
          <button type="button" class="preset-btn" data-value="50">50</button>
          <button type="button" class="preset-btn" data-value="60">60</button>
        </div>
      </div>
      <div class="field">
        <div class="say">
          <label for="breakDuration">Break lasts</label>
          <input type="number" id="breakDuration" min="10" value="60">
          <span>seconds</span>
        </div>
        <div class="presets" id="breakPresets">
          <button type="button" class="preset-btn" data-value="30">30</button>
          <button type="button" class="preset-btn" data-value="60">60</button>
          <button type="button" class="preset-btn" data-value="90">90</button>
          <button type="button" class="preset-btn" data-value="120">120</button>
        </div>
      </div>
      <label class="row field">
        <span><span class="row-label">Emergency unlock</span><span class="hint">Hold 5 seconds to leave a break early</span></span>
        <input type="checkbox" class="switch" id="emergencyUnlock">
      </label>
    </section>

    <section>
      <label class="row">
        <span><h2>Sleep Mode</h2><span class="hint">Shuts the computer down at bedtime</span></span>
        <input type="checkbox" class="switch" id="sleepModeEnabled">
      </label>
      <div class="sub" id="sleepModeSettings">
        <div class="say">
          <label for="sleepModeBedtime">Bedtime</label>
          <input type="time" id="sleepModeBedtime" value="22:00">
        </div>
      </div>
    </section>

    <section>
      <label class="row">
        <span><h2>Game Limiter</h2><span class="hint">Closes games past the daily limit</span></span>
        <input type="checkbox" class="switch" id="gameLimiterEnabled">
      </label>
      <div class="sub" id="gameLimiterSettings">
        <div class="say">
          <label for="gameLimitHours">Daily limit</label>
          <input type="number" id="gameLimitHours" min="0.5" step="0.5" value="4">
          <span>hours</span>
        </div>

        <p class="sub-title">Games</p>
        <ul class="game-list" id="gameList"></ul>
        <p class="hint game-empty" id="gameEmpty">No games added yet.</p>
        <div class="game-add-row">
          <button type="button" class="btn btn-small" id="addGameBtn">Add game…</button>
          <button type="button" class="btn btn-small" id="scanSteamBtn">Scan Steam games</button>
        </div>

        <div class="steam-scan-panel" id="steamScanPanel">
          <p class="hint steam-scan-status" id="steamScanStatus"></p>
          <ul class="steam-scan-list" id="steamScanList"></ul>
          <div class="steam-scan-actions" id="steamScanActions">
            <button type="button" class="btn btn-small btn-primary" id="steamAddSelectedBtn">Add selected</button>
            <button type="button" class="btn btn-small btn-quiet" id="steamScanCloseBtn">Close list</button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <label class="row">
        <h2>Launch at startup</h2>
        <input type="checkbox" class="switch" id="launchAtLogin">
      </label>
    </section>
  </main>

  <footer class="foot">
    <button type="button" class="btn" id="cancelBtn">Cancel</button>
    <button type="button" class="btn btn-primary" id="saveBtn">Save</button>
  </footer>

  <script>
    const intervalInput = document.getElementById('interval');
    const intervalPresets = document.getElementById('intervalPresets');

    const breakInput = document.getElementById('breakDuration');
    const breakPresets = document.getElementById('breakPresets');

    const launchAtLoginCheckbox = document.getElementById('launchAtLogin');
    const emergencyUnlockCheckbox = document.getElementById('emergencyUnlock');
    const sleepModeCheckbox = document.getElementById('sleepModeEnabled');
    const sleepModeSettings = document.getElementById('sleepModeSettings');
    const sleepModeBedtime = document.getElementById('sleepModeBedtime');
    const themePicker = document.getElementById('themePicker');
    const modePicker = document.getElementById('modePicker');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    const gameLimiterCheckbox = document.getElementById('gameLimiterEnabled');
    const gameLimiterSettings = document.getElementById('gameLimiterSettings');
    const gameLimitHoursInput = document.getElementById('gameLimitHours');
    const gameListEl = document.getElementById('gameList');
    const gameEmptyEl = document.getElementById('gameEmpty');
    const addGameBtn = document.getElementById('addGameBtn');
    const scanSteamBtn = document.getElementById('scanSteamBtn');
    const steamScanPanel = document.getElementById('steamScanPanel');
    const steamScanStatus = document.getElementById('steamScanStatus');
    const steamScanList = document.getElementById('steamScanList');
    const steamScanActions = document.getElementById('steamScanActions');
    const steamAddSelectedBtn = document.getElementById('steamAddSelectedBtn');
    const steamScanCloseBtn = document.getElementById('steamScanCloseBtn');

    let currentTheme = 'warm';
    let dark = true;
    let gameList = [];
    let gameNames = {}; // exe (lowercase) -> friendly display name
    let gamePauseSet = new Set(); // exes (lowercase) that pause break reminders

    function displayName(exe) {
      return gameNames[String(exe).toLowerCase()] || exe;
    }

    function renderGameList() {
      gameListEl.innerHTML = '';
      gameEmptyEl.style.display = gameList.length ? 'none' : 'block';
      gameList.forEach((name, idx) => {
        const lower = String(name).toLowerCase();
        const li = document.createElement('li');
        li.className = 'game-item';

        const span = document.createElement('span');
        span.className = 'game-name';
        span.textContent = displayName(name);
        span.title = name;

        const pauseLabel = document.createElement('label');
        pauseLabel.className = 'game-pause';
        pauseLabel.title = 'Pause stand-up reminders while this game is running';
        const pauseCb = document.createElement('input');
        pauseCb.type = 'checkbox';
        pauseCb.checked = gamePauseSet.has(lower);
        pauseCb.addEventListener('change', () => {
          if (pauseCb.checked) gamePauseSet.add(lower);
          else gamePauseSet.delete(lower);
        });
        pauseLabel.appendChild(pauseCb);
        pauseLabel.appendChild(document.createTextNode('Pause breaks'));

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'icon-btn';
        btn.innerHTML = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg>';
        btn.title = 'Remove';
        btn.setAttribute('aria-label', 'Remove ' + displayName(name));
        btn.addEventListener('click', () => {
          const [removed] = gameList.splice(idx, 1);
          if (removed) {
            delete gameNames[String(removed).toLowerCase()];
            gamePauseSet.delete(String(removed).toLowerCase());
          }
          renderGameList();
        });

        li.appendChild(span);
        li.appendChild(pauseLabel);
        li.appendChild(btn);
        gameListEl.appendChild(li);
      });
    }

    gameLimiterCheckbox.addEventListener('change', () => {
      gameLimiterSettings.classList.toggle('visible', gameLimiterCheckbox.checked);
    });

    // Add an executable to the list (deduped, case-insensitive). Returns true if added.
    // friendlyName (optional) is stored for display instead of the exe name.
    function addGameByExe(name, friendlyName) {
      const lower = String(name || '').toLowerCase();
      if (!lower) return false;
      if (friendlyName) gameNames[lower] = friendlyName;
      if (gameList.some(g => g.toLowerCase() === lower)) return false;
      gameList.push(lower);
      renderGameList();
      return true;
    }

    addGameBtn.addEventListener('click', async () => {
      const name = await window.electronAPI.pickGameExe();
      if (name) addGameByExe(name);
    });

    // --- Steam scan ---
    function isGameAdded(exe) {
      return gameList.some(g => g.toLowerCase() === String(exe).toLowerCase());
    }

    function renderScanList(games) {
      steamScanList.innerHTML = '';
      games.forEach((game) => {
        const li = document.createElement('li');
        li.className = 'steam-scan-item';

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.dataset.exe = game.exe;
        cb.dataset.name = game.name;

        const name = document.createElement('span');
        name.className = 'steam-scan-name';
        name.textContent = game.name;

        const exe = document.createElement('span');
        exe.className = 'steam-scan-exe';
        exe.textContent = game.exe;

        if (isGameAdded(game.exe)) {
          li.classList.add('added');
          cb.checked = true;
          cb.disabled = true;
          exe.textContent = game.exe + ' · added';
        } else {
          li.addEventListener('click', (e) => {
            if (e.target !== cb) cb.checked = !cb.checked;
          });
        }

        li.appendChild(cb);
        li.appendChild(name);
        li.appendChild(exe);
        steamScanList.appendChild(li);
      });
      steamScanActions.classList.toggle('visible', games.length > 0);
    }

    scanSteamBtn.addEventListener('click', async () => {
      steamScanPanel.classList.add('visible');
      steamScanList.innerHTML = '';
      steamScanActions.classList.remove('visible');
      steamScanStatus.textContent = 'Scanning Steam libraries…';
      scanSteamBtn.disabled = true;
      try {
        const games = await window.electronAPI.scanSteamGames();
        if (!games || !games.length) {
          steamScanStatus.textContent = 'No Steam games found. Use "Add game…" to pick an .exe manually.';
          return;
        }
        steamScanStatus.textContent = `Found ${games.length} game${games.length === 1 ? '' : 's'}. Tick the ones to limit.`;
        renderScanList(games);
      } catch (err) {
        steamScanStatus.textContent = 'Could not scan Steam. Use "Add game…" instead.';
      } finally {
        scanSteamBtn.disabled = false;
      }
    });

    steamAddSelectedBtn.addEventListener('click', () => {
      const boxes = steamScanList.querySelectorAll('input[type="checkbox"]:checked:not(:disabled)');
      let added = 0;
      boxes.forEach((cb) => { if (addGameByExe(cb.dataset.exe, cb.dataset.name)) added++; });
      steamScanPanel.classList.remove('visible');
      steamScanList.innerHTML = '';
      steamScanStatus.textContent = '';
      steamScanActions.classList.remove('visible');
    });

    steamScanCloseBtn.addEventListener('click', () => {
      steamScanPanel.classList.remove('visible');
      steamScanList.innerHTML = '';
      steamScanStatus.textContent = '';
      steamScanActions.classList.remove('visible');
    });

    function validateGameLimit() {
      const val = parseFloat(gameLimitHoursInput.value);
      const isValid = !isNaN(val) && val >= 0.5;
      gameLimitHoursInput.classList.toggle('error', !isValid);
      return isValid;
    }
    gameLimitHoursInput.addEventListener('input', validateGameLimit);

    function applyTheme(theme) {
      document.documentElement.className = `theme-${theme}${dark ? ' dark' : ''}`;
      currentTheme = theme;
      themePicker.querySelectorAll('.theme-btn').forEach(btn => {
        btn.setAttribute('aria-pressed', btn.dataset.theme === theme);
      });
      modePicker.querySelectorAll('button').forEach(btn => {
        btn.setAttribute('aria-pressed', (btn.dataset.mode === 'dark') === dark);
      });
    }

    modePicker.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        dark = btn.dataset.mode === 'dark';
        applyTheme(currentTheme);
      });
    });

    themePicker.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        applyTheme(btn.dataset.theme);
      });
    });

    sleepModeCheckbox.addEventListener('change', () => {
      sleepModeSettings.classList.toggle('visible', sleepModeCheckbox.checked);
    });

    function updatePresetButtons(container, input) {
      const value = parseInt(input.value, 10);
      container.querySelectorAll('.preset-btn').forEach(btn => {
        const presetVal = parseInt(btn.dataset.value, 10);
        btn.classList.toggle('active', presetVal === value);
      });
    }

    function setupPresets(container, input) {
      container.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          input.value = btn.dataset.value;
          updatePresetButtons(container, input);
          input.classList.remove('error');
        });
      });
    }

    setupPresets(intervalPresets, intervalInput);
    setupPresets(breakPresets, breakInput);

    intervalInput.addEventListener('input', () => {
      updatePresetButtons(intervalPresets, intervalInput);
      validateInterval();
    });

    breakInput.addEventListener('input', () => {
      updatePresetButtons(breakPresets, breakInput);
      validateBreak();
    });

    function validateInterval() {
      const val = parseInt(intervalInput.value, 10);
      const isValid = !isNaN(val) && val >= 1;
      intervalInput.classList.toggle('error', !isValid);
      return isValid;
    }

    function validateBreak() {
      const val = parseInt(breakInput.value, 10);
      const isValid = !isNaN(val) && val >= 10;
      breakInput.classList.toggle('error', !isValid);
      return isValid;
    }

    window.electronAPI.onSettingsLoad((settings) => {
      intervalInput.value = settings.interval;
      breakInput.value = settings.breakDuration;
      launchAtLoginCheckbox.checked = settings.launchAtLogin || false;
      emergencyUnlockCheckbox.checked = settings.emergencyUnlock !== false;
      sleepModeCheckbox.checked = settings.sleepModeEnabled || false;
      sleepModeBedtime.value = settings.sleepModeBedtime || '22:00';
      sleepModeSettings.classList.toggle('visible', sleepModeCheckbox.checked);
      gameLimiterCheckbox.checked = settings.gameLimiterEnabled || false;
      gameLimitHoursInput.value = settings.gameLimitHours || 4;
      gameList = Array.isArray(settings.gameList) ? settings.gameList.slice() : [];
      gameNames = (settings.gameNames && typeof settings.gameNames === 'object')
        ? { ...settings.gameNames } : {};
      gamePauseSet = new Set(Array.isArray(settings.gamePauseList)
        ? settings.gamePauseList.map((e) => String(e).toLowerCase()) : []);
      gameLimiterSettings.classList.toggle('visible', gameLimiterCheckbox.checked);
      renderGameList();
      dark = settings.dark !== false;
      applyTheme(settings.theme || 'warm');
      updatePresetButtons(intervalPresets, intervalInput);
      updatePresetButtons(breakPresets, breakInput);
    });

    saveBtn.addEventListener('click', () => {
      const intervalValid = validateInterval();
      const breakValid = validateBreak();

      if (!intervalValid) {
        intervalInput.focus();
        return;
      }
      if (!breakValid) {
        breakInput.focus();
        return;
      }
      if (gameLimiterCheckbox.checked && !validateGameLimit()) {
        gameLimitHoursInput.focus();
        return;
      }

      window.electronAPI.saveSettings({
        interval: Math.max(1, parseInt(intervalInput.value, 10)),
        breakDuration: Math.max(10, parseInt(breakInput.value, 10)),
        launchAtLogin: launchAtLoginCheckbox.checked,
        emergencyUnlock: emergencyUnlockCheckbox.checked,
        sleepModeEnabled: sleepModeCheckbox.checked,
        sleepModeBedtime: sleepModeBedtime.value,
        theme: currentTheme,
        dark: dark,
        gameLimiterEnabled: gameLimiterCheckbox.checked,
        gameLimitHours: Math.max(0.5, parseFloat(gameLimitHoursInput.value) || 4),
        gameList: gameList,
        // Only keep names for exes still in the list.
        gameNames: gameList.reduce((acc, exe) => {
          const k = String(exe).toLowerCase();
          if (gameNames[k]) acc[k] = gameNames[k];
          return acc;
        }, {}),
        // Only keep pause flags for exes still in the list.
        gamePauseList: gameList.filter((exe) => gamePauseSet.has(String(exe).toLowerCase()))
      });
    });

    cancelBtn.addEventListener('click', () => window.electronAPI.cancelSettings());
    document.getElementById('closeBtn').addEventListener('click', () => window.electronAPI.cancelSettings());
