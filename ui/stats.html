<!DOCTYPE html>
<html lang="en" class="theme-warm dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StandBuddy Stats</title>

  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="panel.css">
  <style>
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }

    /* The streak borrows the break timer's thin accent numerals. */
    .streak { display: flex; align-items: center; gap: 16px; }
    .streak-number {
      font-size: 56px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--accent-ink);
    }
    .streak-label { font-size: 15px; font-weight: 600; }

    .today { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 14px; }
    .today > div { padding-left: 14px; border-left: var(--hairline); }
    .today > div:first-child { padding-left: 0; border-left: 0; }
    .today dd { font-size: 26px; font-weight: 300; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .today dt { font-size: 12.5px; color: var(--text-secondary); }

    .week-chart { display: flex; align-items: flex-end; gap: 10px; height: 120px; margin-top: 12px; }
    .day-bar { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .day-count { min-height: 18px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
    .bar-fill { width: 100%; max-width: 36px; border-radius: 4px 4px 0 0; background: var(--accent); }
    .bar-fill.empty { background: color-mix(in srgb, var(--text-primary) 18%, transparent); }
    .day-label {
      width: 100%;
      margin-top: 6px;
      padding-top: 6px;
      border-top: var(--hairline);
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .week-chart + .hint { margin-top: 12px; }

    .achievements-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
    .achievement {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 6px 10px;
      border-radius: 12px;
      text-align: center;
      cursor: help;
    }
    .achievement.unlocked { background: var(--accent-soft); }
    .achievement.locked { opacity: 0.45; }
    .achievement.locked .achievement-icon { filter: grayscale(1); }
    .achievement-icon { font-size: 24px; line-height: 1; }
    .achievement-name { font-size: 11.5px; line-height: 1.25; color: var(--text-secondary); }
    .achievement.unlocked .achievement-name { color: var(--text-primary); }

    .foot { justify-content: space-between; min-height: 69px; }
    .foot[hidden] { display: none; }
    .foot .btn-quiet { margin-left: -14px; }
    .confirm-text { flex: 1; font-size: 13px; line-height: 1.35; }
  </style>
</head>
<body>
  <header class="bar" data-drag>
    <h1>Stats</h1>
    <button type="button" class="icon-btn" id="closeBtn" aria-label="Close"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
  </header>

  <main class="scroll">
    <section>
      <div class="streak">
        <div class="streak-number" id="streakDays">0</div>
        <div>
          <div class="streak-label">day streak</div>
          <div class="hint">Days in a row with at least one completed break</div>
        </div>
      </div>
    </section>

    <section>
      <h2>Today</h2>
      <dl class="today">
        <div><dd id="todayCompleted">0</dd><dt>Completed</dt></div>
        <div><dd id="todayEmergency">0</dd><dt>Skipped</dt></div>
        <div><dd id="todayShown">0</dd><dt>Shown</dt></div>
        <div><dd id="todayMinutes">0</dd><dt>Minutes away</dt></div>
      </dl>
    </section>

    <section>
      <h2>Last 7 days</h2>
      <div class="week-chart" id="weekChart"></div>
      <p class="hint" id="avgInfo"></p>
    </section>

    <section>
      <div class="head">
        <h2>Achievements</h2>
        <span class="hint" id="totalBadge"></span>
      </div>
      <div class="achievements-grid" id="achievementsGrid"></div>
    </section>
  </main>

  <footer class="foot" id="resetIdle">
    <button type="button" class="btn btn-quiet" id="resetBtn">Reset stats…</button>
  </footer>
  <footer class="foot" id="resetConfirm" hidden>
    <span class="confirm-text">Delete all stats and achievements? This cannot be undone.</span>
    <button type="button" class="btn" id="resetCancel">Keep</button>
    <button type="button" class="btn btn-danger" id="resetDo">Delete</button>
  </footer>

  <script>
    const todayCompleted = document.getElementById('todayCompleted');
    const todayEmergency = document.getElementById('todayEmergency');
    const todayShown = document.getElementById('todayShown');
    const todayMinutes = document.getElementById('todayMinutes');
    const streakDays = document.getElementById('streakDays');
    const weekChart = document.getElementById('weekChart');
    const avgInfo = document.getElementById('avgInfo');
    const achievementsGrid = document.getElementById('achievementsGrid');
    const totalBadge = document.getElementById('totalBadge');
    const resetIdle = document.getElementById('resetIdle');
    const resetConfirm = document.getElementById('resetConfirm');

    function updateUI(data) {
      todayCompleted.textContent = data.today.completed;
      todayEmergency.textContent = data.today.emergency;
      todayShown.textContent = data.today.shown;
      todayMinutes.textContent = Math.round(data.today.breakMinutes * 10) / 10;
      streakDays.textContent = data.streak;

      renderWeekChart(data.last7Days);

      if (data.avgMinutesBetween > 0) {
        avgInfo.textContent = `Completed breaks per day. Reminder interval: ${data.avgMinutesBetween} min`;
      } else {
        avgInfo.textContent = 'No completed breaks this week yet.';
      }

      renderAchievements(data.achievements);
    }

    function renderWeekChart(last7Days) {
      const maxCompleted = Math.max(...last7Days.map(d => d.completed), 1);
      weekChart.innerHTML = '';

      last7Days.forEach(day => {
        // Tallest bar is 70px; a day with no breaks keeps a 2px stub on the baseline.
        const height = day.completed > 0 ? Math.max(Math.round((day.completed / maxCompleted) * 70), 6) : 2;
        const barDiv = document.createElement('div');
        barDiv.className = 'day-bar';
        barDiv.innerHTML = `
          <div class="day-count">${day.completed > 0 ? day.completed : ''}</div>
          <div class="bar-fill ${day.completed === 0 ? 'empty' : ''}" style="height: ${height}px"></div>
          <div class="day-label">${day.dayName}</div>
        `;
        weekChart.appendChild(barDiv);
      });
    }

    function renderAchievements(achievements) {
      achievementsGrid.innerHTML = '';
      let unlockedCount = 0;

      achievements.forEach(a => {
        if (a.unlocked) unlockedCount++;
        const div = document.createElement('div');
        div.className = `achievement ${a.unlocked ? 'unlocked' : 'locked'}`;
        div.title = a.description;
        div.innerHTML = `
          <div class="achievement-icon">${a.icon}</div>
          <div class="achievement-name">${a.name}</div>
        `;
        achievementsGrid.appendChild(div);
      });

      totalBadge.textContent = `${unlockedCount} of ${achievements.length} unlocked`;
    }

    function askReset(asking) {
      resetIdle.hidden = asking;
      resetConfirm.hidden = !asking;
    }

    window.electronAPI.onStatsLoad((data) => {
      document.documentElement.className = `theme-${data.theme || 'warm'}${data.dark === false ? '' : ' dark'}`;
      updateUI(data);
    });

    window.electronAPI.onStatsReset((data) => {
      updateUI(data);
    });

    document.getElementById('resetBtn').addEventListener('click', () => askReset(true));
    document.getElementById('resetCancel').addEventListener('click', () => askReset(false));
    document.getElementById('resetDo').addEventListener('click', () => {
      askReset(false);
      window.electronAPI.resetStats();
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.electronAPI.closeStats();
    });
  </script>
</body>
</html>
