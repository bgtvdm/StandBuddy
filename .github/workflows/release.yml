name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rust toolchain comes from src-tauri/rust-toolchain.toml via the preinstalled rustup.
      - run: npm run build
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: src-tauri/target/release/bundle/nsis/StandBuddy_*_x64-setup.exe
